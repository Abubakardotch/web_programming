<!DOCTYPE html>
<html lang="en">
<head>
    <title>Continental Hotel Reservation Form</title>
    <style>
        body {
            background-color: #f0f0f0;
        }
        h2 {
            color: red;
        }
        table {
            background-color: #d5e5f5;
            border: 2px solid #555555;
        }
        .name {
            font-weight: bold;
        }
        td {
            border: 2px solid #777777;
            padding: 8px 12px;
            font-size: 15px;
        }
        .button {
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <form>
            <h2>Continental Hotel Reservation Form</h2>
            <table>
                <tr>
                    <td class="name">Name</td>
                    <td>
                        <input type="text" placeholder="Enter your name">
                    </td>
                </tr>
                <tr>
                    <td class="name">eMail</td>
                    <td>
                        <input type="email" value="info@continental.pk">
                    </td>
                </tr>
                <tr>
                    <td class="name">Mobile No</td>
                    <td>
                        <input type="text" placeholder="Enter your cell number">
                    </td>
                </tr>
                <tr>
                    <td class="name">Arrival Time</td>
                    <td>
                        <input type="text" placeholder="Enter your arrival time">
                    </td>
                </tr>
                <tr>
                    <td class="name">Departure</td>
                    <td>
                        <input type="text">
                        <input type="time">
                    </td>
                </tr>
                <tr>
                    <td class="name">Room Type</td>
                    <td>
                        <input type="radio" name="room">Single
                        <input type="radio" name="room">Double
                        <br>
                        <input type="radio" name="room" checked>Presidential Suite
                    </td>
                </tr>
                <tr>
                    <td class="name">Preferences</td>
                    <td>
                        <input type="checkbox"> Non-Smoking
                        <br>
                        <input type="checkbox"> Internet
                        <br>
                        <input type="checkbox"> Firm Mattress
                    </td>
                </tr>
                <tr>
                    <td class="name">Mode of Payment</td>
                    <td>
                        <input type="checkbox">Cash
                        <input type="checkbox">Check
                        <br>
                        <input type="checkbox">Credit Card
                        <button type="button">Select Card</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="button">
                        <button type="submit">Send Data</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
